name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Verify syntax (compilation)
        run: python -m py_compile src/davis_monitor.py

      - name: Lint (flake8, serious errors only)
        run: |
          # E9/F63/F7/F82: syntax errors and undefined names.
          # Other style rules are not strictly enforced here because the
          # script uses curses and a specific console layout.
          flake8 src/ --select=E9,F63,F7,F82 --show-source

      - name: Run unit tests
        run: pytest tests/ -v
