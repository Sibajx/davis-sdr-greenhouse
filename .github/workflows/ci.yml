name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Verificar sintaxis (compilación)
        run: python -m py_compile src/davis_monitor.py

      - name: Lint (flake8, solo errores graves)
        run: |
          # E9/F63/F7/F82: errores de sintaxis y nombres indefinidos.
          # El resto de reglas de estilo no se aplican estrictamente aquí
          # porque el script usa curses y formato de consola específico.
          flake8 src/ --select=E9,F63,F7,F82 --show-source

      - name: Ejecutar pruebas unitarias
        run: pytest tests/ -v
